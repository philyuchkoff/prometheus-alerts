# Инструмент: Windows exporter: https://github.com/prometheus-community/windows_exporter

groups:

- name: WindowsExporter

  rules:

    - alert: WindowsDown
      expr: 'up{job="windows"} == 0'
      for: 0m
      labels:
        severity: critical
      annotations:
        summary: Windows down (instance {{ $labels.instance }})
        description: "Windows host is down\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

    - alert: WindowsCpuHigh
      expr: '100 - (avg by (instance) (rate(windows_cpu_time_total{mode="idle"}[2m])) * 100) > 85'
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: Windows CPU high (instance {{ $labels.instance }})
        description: "CPU load is > 85%\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

    - alert: WindowsMemoryHigh
      expr: '(1 - (windows_os_physical_memory_free_bytes / windows_os_physical_memory_bytes)) * 100 > 90'
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: Windows memory high (instance {{ $labels.instance }})
        description: "Memory usage is > 90%\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

    - alert: WindowsDiskAlmostFull
      expr: '(windows_logical_disk_free_bytes / windows_logical_disk_size_bytes) * 100 < 10'
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: Windows disk almost full (instance {{ $labels.instance }})
        description: "Disk {{ $labels.volume }} is almost full (< 10% left)\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"